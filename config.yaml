# ParseAnything Global Configuration

# --- Agent 1: Foundation, Layout, Platform ---
core:
  dpi: 200
  workers: 4
  confidence_threshold: 0.6
  enable_cloud_fallbacks: false

backends:
  ocr: rapidocr
  layout: docling
  vlm: vlm_local

costs:
  ocr_cost_per_page: 0.0015
  vlm_cost_per_page: 0.005

# --- Agent 2: LLM, Retrieval, Domain ---
# (Agent 2 will fill these in)
llm:
  backend: ollama
  model: llama3.2:1b

retrieval:
  use_vector: false

# --- Agent 3: Tables, Charts, Math ---
tables:
  backend: pdfplumber
  
charts:
  vlm_local_url: http://localhost:11434/api/generate
  enable_gemini_vlm: false
  
math:
  backend: pix2tex

# --- Agent 4: Intelligence and UI ---
# (Agent 4 will fill these in)
ui:
  theme: light
