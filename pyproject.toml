[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parseanything"
version = "0.1.0"
description = "A high-fidelity universal document ingestion engine."
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "typer>=0.9.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "python-magic",
    "python-docx",
    "python-pptx",
    "openpyxl",
    "pandas",
    "beautifulsoup4",
    "pypdfium2",
    "pillow",
    "rapidocr_onnxruntime",
    "onnxruntime",
    "pyclipper",
    "shapely",
    "pydantic-settings",
    "pyyaml"
]
requires-python = ">=3.11"

[project.optional-dependencies]
layout = ["docling"]
llm = ["ollama"]
retrieval = ["sqlite-vec", "fastembed"]
tts = ["kokoro"]
sensitive = ["presidio-analyzer", "presidio-anonymizer", "spacy", "detect-secrets"]
